name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build native database bridge
        run: msbuild src-native/CM26.EngineBridge/CM26.EngineBridge.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Restore
        run: dotnet restore CM26.slnx
      - name: Build
        run: dotnet build CM26.slnx -c Release --no-restore -warnaserror -m:1 -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test tests/CM26.Tests/CM26.Tests.csproj -c Release --no-build --no-restore
      - name: Classic CM16 workspace smoke
        shell: pwsh
        run: |
          $exe = 'src\CM26.LegacyUI\bin\Release\net48\CM26.LegacyUI.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--cm26-workspace-size-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Classic workspace smoke failed (exit $($process.ExitCode))." }
      - name: Classic CM16 feature integration
        shell: pwsh
        run: |
          $exe = 'src\CM26.LegacyUI\bin\Release\net48\CM26.LegacyUI.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--cm26-ui-integration-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path ([System.IO.Path]::GetTempPath()) 'cm26-legacy-error.log'
            if (Test-Path $errorLog) { Get-Content $errorLog }
            throw "Classic feature integration failed (exit $($process.ExitCode))."
          }
      - name: Validate release metadata
        shell: pwsh
        run: ./Release/validate_release_metadata.ps1
